<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisar día · DIALOGUE</title>
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  .head { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600;
    border: 1px solid currentColor;
  }
  .badge.ok { color: var(--ok); }
  .badge.warning { color: var(--warning); }
  .badge.muted { color: var(--text-muted); }
  .status-detail { color: var(--text-secondary); }
  .pending { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .pending .label { color: var(--text-secondary); margin-right: 2px; }
  .chip { padding: 2px 10px; border-radius: 999px; font-size: 13px; }
  .chip.unsent { border-color: var(--warning); }

  .totals { display: flex; gap: 8px 24px; flex-wrap: wrap; margin-bottom: 12px; }
  .totals div { color: var(--text-secondary); }
  .totals strong { color: var(--text-primary); font-weight: 600; margin-left: 4px; }

  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; font-size: 12px; font-weight: 600; color: var(--text-secondary);
    padding: 8px 8px; border-bottom: 1px solid var(--border);
  }
  td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  td.time { text-align: right; white-space: nowrap; color: var(--text-secondary); width: 1%; }
  td.assign { width: 300px; }
  td.remember { width: 1%; text-align: center; }
  th.time-h { text-align: right; }
  th.remember-h { text-align: center; }
  .activity { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .activity-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 460px; }
  .kind {
    flex: none; font-size: 11px; font-weight: 600; letter-spacing: .03em;
    padding: 1px 6px; border-radius: 4px; background: var(--track); color: var(--text-secondary);
  }
  .members { margin: 4px 0 0 46px; color: var(--text-muted); font-size: 13px; }
  .toggle { border: 0; padding: 0 4px; color: var(--accent); }

  .pick {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    text-align: left; background: var(--surface-0);
  }
  .pick .value { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pick.client .value { font-weight: 600; }
  .pick.personal .value, .pick.unassigned .value { color: var(--text-secondary); }
  .pick .caret { color: var(--text-muted); flex: none; }
  .assign-row { display: flex; gap: 6px; align-items: center; }
  .assign-row .pick { flex: 1; min-width: 0; }
  button.icon { flex: none; padding: 5px 8px; font-size: 12px; color: var(--text-secondary); }
  button.link { border: 0; padding: 5px 4px; color: var(--accent); font-size: 13px; }
  tr.split td { border-bottom-style: dashed; }
  tr.part td { padding-top: 3px; padding-bottom: 3px; background: var(--surface-0); }
  tr.part td.part-name { padding-left: 46px; color: var(--text-secondary); font-size: 13px; }
  input.part-time {
    width: 76px; padding: 4px 8px; text-align: right; font: inherit; font-variant-numeric: tabular-nums;
    color: var(--text-primary); background: var(--surface-1); border: 1px solid var(--border); border-radius: 6px;
  }

  #picker {
    position: absolute; z-index: 20; width: 320px;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: var(--shadow); padding: 8px;
  }
  #picker ul { list-style: none; margin: 8px 0 0; padding: 0; max-height: 280px; overflow: auto; }
  #picker li { padding: 6px 8px; border-radius: 5px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
  #picker li.active { background: var(--track); }
  #picker li.separator { padding: 0; margin: 4px 0; border-top: 1px solid var(--border); cursor: default; }
  #picker li .hint { color: var(--text-muted); font-size: 12px; }
  #picker li.create { color: var(--accent); }
  #picker .msg { margin-top: 6px; }

  tr.manual td { background: var(--surface-0); }
  input.manual-desc {
    width: 100%; min-width: 0; padding: 4px 8px; font: inherit;
    color: var(--text-primary); background: var(--surface-1); border: 1px solid var(--border); border-radius: 6px;
  }
  .add-manual { margin-top: 10px; }

  .actions { display: flex; align-items: center; justify-content: flex-end; gap: 16px; margin-top: 16px; }
  .empty { color: var(--text-muted); padding: 24px 8px; text-align: center; }
  .hours-warnings {
    margin-top: 16px; padding: 10px 14px; border-radius: 8px;
    border: 1px solid var(--warning); border-left-width: 4px; background: var(--surface-0);
  }
  .hours-warnings strong { color: var(--warning); }
  .hours-warnings ul { margin: 4px 0 0; padding-left: 18px; }

  .comments { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
  .comments h3 { margin: 0 0 2px; font-size: 15px; }
  .comments .help { margin: 0 0 12px; color: var(--text-secondary); font-size: 13px; }
  .comment { display: grid; grid-template-columns: 200px 1fr; gap: 12px; align-items: start; margin-bottom: 10px; }
  .comment label { padding-top: 7px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .comment label.general { font-weight: 400; color: var(--text-secondary); }
  .comment textarea {
    font: inherit; color: var(--text-primary); width: 100%; min-height: 38px; resize: vertical;
    padding: 7px 10px; background: var(--surface-0); border: 1px solid var(--border); border-radius: 6px;
  }
  .comment textarea:focus-visible { outline: 2px solid var(--temporal-pulse); outline-offset: 1px; }
  @media (max-width: 700px) { .comment { grid-template-columns: 1fr; gap: 4px; } }
</style>
</head>
<body>
<header>
  <a class="brand" href="/"><img src="/logo.svg" alt=""><span>DIALOGUE</span></a>
  <nav>
    <a href="/">Hoy</a>
    <a href="/revisar" aria-current="page">Revisar día</a>
    <a href="/ajustes">Ajustes</a>
  </nav>
  <div class="day-nav">
    <button id="prev" aria-label="Día anterior">◀</button>
    <span id="day"></span>
    <button id="next" aria-label="Día siguiente">▶</button>
  </div>
  <button id="today">Hoy</button>
</header>

<main>
  <div class="banner" id="warning" hidden></div>

  <div class="head">
    <span class="badge" id="status"></span>
    <span class="status-detail" id="status-detail"></span>
    <div class="pending" id="pending"></div>
  </div>

  <section class="card">
    <div class="totals" id="totals"></div>
    <table id="table">
      <thead>
        <tr><th>Actividad</th><th class="time-h">Tiempo</th><th>Asignar a</th><th class="remember-h" title="Preseleccionar este cliente la próxima vez, para todo el equipo">Recordar</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>No hay actividad registrada este día.</div>
    <button class="add-manual" id="add-manual" title="Reuniones, llamadas, visitas… lo que no hiciste en el ordenador">+ Añadir tiempo manual</button>
    <div class="hours-warnings" id="hours-warnings" role="status" hidden></div>
    <div class="comments" id="comments" hidden>
      <h3>Comentarios</h3>
      <p class="help">Opcional. Qué hiciste en el día o para cada cliente; se verá en la web junto a los tiempos.</p>
      <div id="comment-fields"></div>
    </div>
    <div class="actions">
      <span class="msg" id="msg"></span>
      <button class="primary" id="confirm">Confirmar y enviar</button>
    </div>
  </section>
</main>

<div id="picker" hidden>
  <input type="search" id="picker-search" placeholder="Buscar o crear cliente…" autocomplete="off" maxlength="120">
  <ul id="picker-list" role="listbox"></ul>
  <div class="msg error" id="picker-msg"></div>
</div>

<script type="module">
  import { api, appName, formatDuration, longDate, shiftDay, shortDate, todayISO } from '/common.js';

  /** Las actividades más cortas que esto se agrupan en una sola fila. */
  const SHORT_SECONDS = 30;
  const KIND_LABELS = { domain: 'Web', chat: 'Chat', app: 'App', manual: 'Manual' };
  /** El tiempo manual solo puede ir a interno o a un cliente. */
  const MANUAL_BUCKETS = ['internal'];
  const MAX_KEY_LENGTH = 255;
  const FIXED = [
    { bucket: 'personal', label: 'Personal', hint: 'No se envía' },
    { bucket: 'unassigned', label: 'Sin cliente', hint: 'Solo se envía el total' },
    { bucket: 'internal', label: 'Interno' },
  ];
  const FIXED_LABEL = Object.fromEntries(FIXED.map((f) => [f.bucket, f.label]));

  const $ = (id) => document.getElementById(id);
  let selected = new URLSearchParams(location.search).get('date') ?? todayISO();
  let review = null;
  let catalog = { clients: [], rules: [] };
  /** Filas de la tabla: una por actividad, más una para las cortas agrupadas (con `members`). */
  let rows = [];

  const clientName = (id) => catalog.clients.find((c) => c.id === id)?.name ?? `Cliente #${id}`;
  const choiceLabel = (row) => (row.bucket === 'client' ? clientName(row.clientId) : FIXED_LABEL[row.bucket]);
  const activityLabel = (a) => (a.kind === 'app' ? appName(a.key) : a.key);

  /** Lo ya confirmado ese día manda; si no, la regla del equipo; si no, "Sin cliente". */
  function initialChoice(activity) {
    const savedAll = review.confirmed?.items.filter((i) => i.kind === activity.kind && i.key === activity.key) ?? [];
    // Si se confirmó dividida, se recupera la división (la primera parte vuelve a quedarse con lo que sobra).
    if (savedAll.length > 1) {
      const parts = savedAll.map((i) => ({ bucket: i.bucket, clientId: i.clientId, seconds: i.seconds }));
      fitParts(parts, activity.seconds);
      return { bucket: parts[0].bucket, clientId: parts[0].clientId, remember: false, parts };
    }
    const saved = savedAll[0];
    if (saved) return { bucket: saved.bucket, clientId: saved.clientId, remember: saved.bucket !== 'client' || saved.remember };
    const rule = catalog.rules.find((r) => r.kind === activity.kind && r.key === activity.key);
    if (rule && catalog.clients.some((c) => c.id === rule.clientId)) {
      return { bucket: 'client', clientId: rule.clientId, remember: true };
    }
    return { bucket: 'unassigned', clientId: null, remember: true };
  }

  // --- Dividir una actividad entre varios clientes --------------------------
  // Una fila dividida tiene `parts`. La primera parte se queda siempre con lo que sobra,
  // así la suma cuadra siempre con el tiempo de la actividad.

  /** Reparto de una fila: sin dividir, todo a su asignación; dividida, sus partes. */
  function shares(row) {
    if (!row.parts) return [{ bucket: row.bucket, clientId: row.clientId, seconds: row.seconds }];
    const others = row.parts.slice(1).reduce((s, p) => s + p.seconds, 0);
    return row.parts.map((p, i) => ({ bucket: p.bucket, clientId: p.clientId, seconds: i === 0 ? row.seconds - others : p.seconds }));
  }

  /** Recorta las partes (menos la primera) para que no sumen más que el total. */
  function fitParts(parts, total) {
    let left = total;
    for (const p of parts.slice(1)) {
      p.seconds = Math.max(0, Math.min(p.seconds, left));
      left -= p.seconds;
    }
  }

  /** Mitad de lo que sobra, redondeada a 5 min (o lo que haya si es poco). */
  function halfOfRemainder(row) {
    const left = shares(row)[0].seconds;
    const half = Math.floor(left / 2 / 300) * 300;
    return half >= 300 ? half : Math.floor(left / 60) * 60;
  }

  function splitRow(row) {
    row.parts = [{ bucket: row.bucket, clientId: row.clientId, seconds: 0 }];
    row.parts.push({ bucket: 'unassigned', clientId: null, seconds: halfOfRemainder(row) });
    row.remember = false;
    render();
  }

  function addPart(row) {
    const seconds = halfOfRemainder(row);
    if (seconds < 60) {
      say('No queda tiempo para otra parte: baja primero el de alguna.');
      return;
    }
    row.parts.push({ bucket: 'unassigned', clientId: null, seconds });
    render();
  }

  function removePart(row, index) {
    row.parts.splice(index, 1);
    if (index === 0) row.parts[0].seconds = 0; // La nueva primera parte pasa a quedarse con lo que sobra.
    if (row.parts.length === 1) unsplitRow(row);
    else render();
  }

  function unsplitRow(row) {
    row.bucket = row.parts[0].bucket;
    row.clientId = row.parts[0].clientId;
    row.remember = row.bucket === 'client';
    delete row.parts;
    render();
  }

  /** Acepta "1:30", "90", "90 min", "1h", "1h30", "1,5h". Devuelve minutos o null. */
  function parseMinutes(text) {
    const t = text.trim().toLowerCase().replace(',', '.');
    let m;
    if ((m = /^(\d+):(\d{1,2})$/.exec(t))) return Number(m[1]) * 60 + Number(m[2]);
    if ((m = /^(\d+(?:\.\d+)?)\s*h(?:\s*(\d+)\s*(?:m|min)?)?$/.exec(t))) return Math.round(parseFloat(m[1]) * 60) + Number(m[2] ?? 0);
    if ((m = /^(\d+)\s*(?:m|min)?$/.exec(t))) return Number(m[1]);
    return null;
  }
  const hhmm = (seconds) => `${Math.floor(seconds / 3600)}:${String(Math.floor((seconds % 3600) / 60)).padStart(2, '0')}`;

  function setPartTime(row, index, text) {
    const minutes = parseMinutes(text);
    if (minutes === null) {
      say('Escribe el tiempo como 1:30, 90 o 1h30.');
      render();
      return;
    }
    const others = row.parts.slice(1).reduce((s, p, i) => s + (i + 1 === index ? 0 : p.seconds), 0);
    const max = row.seconds - others;
    row.parts[index].seconds = Math.min(minutes * 60, max);
    if (minutes * 60 > max) say(`Ajustado a ${formatDuration(max)}: es todo lo que queda de ${activityLabel(row)}.`);
    render();
  }

  function say(text) {
    $('msg').className = 'msg error';
    $('msg').textContent = text;
  }

  function buildRows() {
    const long = review.activities.filter((a) => a.seconds >= SHORT_SECONDS);
    const short = review.activities.filter((a) => a.seconds < SHORT_SECONDS);
    rows = long.map((a) => ({ ...a, ...initialChoice(a) }));
    if (short.length > 0) {
      const choices = short.map(initialChoice);
      const same = choices.every((c) => c.bucket === choices[0].bucket && c.clientId === choices[0].clientId);
      rows.push({
        kind: 'group',
        key: `${short.length} ${short.length === 1 ? 'actividad' : 'actividades'} de menos de ${SHORT_SECONDS} s`,
        seconds: short.reduce((s, a) => s + a.seconds, 0),
        members: short,
        ...(same ? choices[0] : { bucket: 'unassigned', clientId: null }),
        remember: false,
      });
    }
    // El tiempo apuntado a mano al confirmar, al final.
    for (const m of review.confirmed?.items.filter((i) => i.kind === 'manual') ?? []) {
      rows.push({ kind: 'manual', key: m.key, seconds: m.seconds, bucket: m.bucket, clientId: m.clientId, remember: false });
    }
  }

  // --- Tiempo manual --------------------------------------------------------

  function addManual() {
    rows.push({ kind: 'manual', key: '', seconds: 30 * 60, bucket: 'internal', clientId: null, remember: false, fresh: true });
    render();
  }

  function setManualTime(row, text) {
    const minutes = parseMinutes(text);
    if (!minutes) {
      say('Escribe el tiempo como 1:30, 90 o 1h30.');
    } else {
      row.seconds = Math.min(minutes * 60, 24 * 3600);
      $('msg').textContent = '';
    }
    render();
  }

  function renderManualRow(row) {
    const tr = document.createElement('tr');
    tr.className = 'manual';

    const tdName = document.createElement('td');
    const activity = document.createElement('div');
    activity.className = 'activity';
    const kind = document.createElement('span');
    kind.className = 'kind';
    kind.textContent = KIND_LABELS.manual;
    const desc = document.createElement('input');
    desc.className = 'manual-desc';
    desc.value = row.key;
    desc.maxLength = MAX_KEY_LENGTH;
    desc.placeholder = 'Qué hiciste (p. ej. reunión con el cliente)';
    desc.setAttribute('aria-label', 'Descripción del tiempo manual');
    desc.addEventListener('input', () => { row.key = desc.value; });
    activity.append(kind, desc);
    tdName.append(activity);
    if (row.fresh) {
      delete row.fresh;
      requestAnimationFrame(() => desc.focus());
    }

    const tdTime = document.createElement('td');
    tdTime.className = 'time num';
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'part-time';
    input.inputMode = 'numeric';
    input.value = hhmm(row.seconds);
    input.setAttribute('aria-label', `Tiempo de ${row.key || 'tiempo manual'} (h:mm)`);
    input.title = 'Escribe 1:30, 90 o 1h30';
    input.addEventListener('change', () => setManualTime(row, input.value));
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });
    tdTime.append(input);

    const tdAssign = document.createElement('td');
    tdAssign.className = 'assign';
    tdAssign.append(pickButton(row, row, row.key || 'tiempo manual'));

    const tdRemove = document.createElement('td');
    tdRemove.className = 'remember';
    const remove = document.createElement('button');
    remove.className = 'icon';
    remove.textContent = '✕';
    remove.title = 'Quitar este tiempo';
    remove.setAttribute('aria-label', `Quitar ${row.key || 'tiempo manual'}`);
    remove.addEventListener('click', () => {
      rows.splice(rows.indexOf(row), 1);
      render();
    });
    tdRemove.append(remove);

    tr.append(tdName, tdTime, tdAssign, tdRemove);
    return tr;
  }

  function render() {
    renderStatus();
    renderTotals();
    const body = $('rows');
    body.replaceChildren();
    $('empty').hidden = rows.length > 0;
    $('empty').textContent = 'No hay actividad registrada este día. Puedes añadir tiempo manual.';
    $('table').hidden = rows.length === 0;
    $('confirm').disabled = rows.length === 0;
    $('confirm').textContent = review.confirmed ? 'Volver a confirmar y enviar' : 'Confirmar y enviar';
    rows.forEach((row) => {
      if (row.kind === 'manual') {
        body.append(renderManualRow(row));
        return;
      }
      body.append(renderRow(row));
      if (row.parts) shares(row).forEach((share, i) => body.append(renderPart(row, share, i)));
    });
    renderComments();
  }

  /** Botón que abre el selector de cliente para una fila o una parte. */
  function pickButton(target, choice, label) {
    const pick = document.createElement('button');
    pick.className = `pick ${choice.bucket}`;
    const value = document.createElement('span');
    value.className = 'value';
    value.textContent = choiceLabel(choice);
    const caret = document.createElement('span');
    caret.className = 'caret';
    caret.textContent = '▾';
    pick.append(value, caret);
    pick.setAttribute('aria-label', `Asignar ${label}: ${value.textContent}`);
    pick.addEventListener('click', () => openPicker(target, pick));
    return pick;
  }

  /** Fila de una parte de una actividad dividida. */
  function renderPart(row, share, index) {
    const tr = document.createElement('tr');
    tr.className = 'part';
    const label = `${activityLabel(row)}, parte ${index + 1}`;

    const tdName = document.createElement('td');
    tdName.className = 'part-name';
    tdName.textContent = index === 0 ? '↳ Lo que sobra' : `↳ Parte ${index + 1}`;

    const tdTime = document.createElement('td');
    tdTime.className = 'time num';
    if (index === 0) {
      tdTime.textContent = formatDuration(share.seconds);
      tdTime.title = 'Se ajusta solo con lo que asignes a las demás partes';
    } else {
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'part-time';
      input.inputMode = 'numeric';
      input.value = hhmm(share.seconds);
      input.setAttribute('aria-label', `Tiempo de ${label} (h:mm)`);
      input.title = 'Escribe 1:30, 90 o 1h30';
      input.addEventListener('change', () => setPartTime(row, index, input.value));
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });
      tdTime.append(input);
    }

    const tdAssign = document.createElement('td');
    tdAssign.className = 'assign';
    tdAssign.append(pickButton(row.parts[index], share, label));

    const tdRemove = document.createElement('td');
    tdRemove.className = 'remember';
    const remove = document.createElement('button');
    remove.className = 'icon';
    remove.textContent = '✕';
    remove.title = 'Quitar esta parte';
    remove.setAttribute('aria-label', `Quitar ${label}`);
    remove.addEventListener('click', () => removePart(row, index));
    tdRemove.append(remove);

    tr.append(tdName, tdTime, tdAssign, tdRemove);
    return tr;
  }

  function renderRow(row) {
    const tr = document.createElement('tr');

    const tdName = document.createElement('td');
    const activity = document.createElement('div');
    activity.className = 'activity';
    const kind = document.createElement('span');
    kind.className = 'kind';
    kind.textContent = row.members ? 'Varias' : KIND_LABELS[row.kind];
    const name = document.createElement('span');
    name.className = 'activity-name';
    name.textContent = row.members ? row.key : activityLabel(row);
    name.title = name.textContent;
    activity.append(kind, name);
    if (row.members) {
      const toggle = document.createElement('button');
      toggle.className = 'toggle';
      toggle.textContent = 'ver';
      const list = document.createElement('div');
      list.className = 'members';
      list.hidden = true;
      list.textContent = row.members.map(activityLabel).join(' · ');
      toggle.addEventListener('click', () => {
        list.hidden = !list.hidden;
        toggle.textContent = list.hidden ? 'ver' : 'ocultar';
      });
      activity.append(toggle);
      tdName.append(activity, list);
    } else {
      tdName.append(activity);
    }

    const tdTime = document.createElement('td');
    tdTime.className = 'time num';
    tdTime.textContent = formatDuration(row.seconds);

    const tdAssign = document.createElement('td');
    tdAssign.className = 'assign';
    const assign = document.createElement('div');
    assign.className = 'assign-row';
    if (row.parts) {
      tr.className = 'split';
      const add = document.createElement('button');
      add.textContent = '+ Añadir parte';
      add.addEventListener('click', () => addPart(row));
      const undo = document.createElement('button');
      undo.className = 'link';
      undo.textContent = 'Quitar división';
      undo.addEventListener('click', () => unsplitRow(row));
      assign.append(add, undo);
    } else {
      assign.append(pickButton(row, row, name.textContent));
      if (!row.members) {
        const split = document.createElement('button');
        split.className = 'icon';
        split.textContent = 'Dividir';
        split.title = 'Repartir este tiempo entre varios clientes';
        split.setAttribute('aria-label', `Dividir ${name.textContent} entre varios clientes`);
        split.addEventListener('click', () => splitRow(row));
        assign.append(split);
      }
    }
    tdAssign.append(assign);

    const tdRemember = document.createElement('td');
    tdRemember.className = 'remember';
    if (!row.members && !row.parts) {
      const box = document.createElement('input');
      box.type = 'checkbox';
      box.checked = row.bucket === 'client' && row.remember;
      box.disabled = row.bucket !== 'client';
      box.title = row.bucket === 'client'
        ? 'Preseleccionar este cliente la próxima vez, para todo el equipo'
        : 'Solo se recuerdan los clientes';
      box.addEventListener('change', () => { row.remember = box.checked; });
      tdRemember.append(box);
    }

    tr.append(tdName, tdTime, tdAssign, tdRemember);
    return tr;
  }

  function renderTotals() {
    const all = rows.flatMap(shares);
    const sum = (pred) => all.filter(pred).reduce((s, r) => s + r.seconds, 0);
    const parts = [
      ['Total', sum(() => true)],
      ['Clientes', sum((r) => r.bucket === 'client')],
      ['Interno', sum((r) => r.bucket === 'internal')],
      ['Sin cliente', sum((r) => r.bucket === 'unassigned')],
      ['Personal', sum((r) => r.bucket === 'personal')],
    ];
    $('totals').replaceChildren(...parts.map(([label, seconds]) => {
      const div = document.createElement('div');
      const strong = document.createElement('strong');
      strong.className = 'num';
      strong.textContent = formatDuration(seconds);
      div.append(label, strong);
      return div;
    }));
    renderHoursWarnings(all);
  }

  // --- Horas contratadas ----------------------------------------------------
  // La web dice cuánto le queda a cada cliente con seguimiento de horas (`hours`).
  // Si el día ya se había enviado, ese tiempo ya está descontado: solo cuenta lo nuevo.

  function hoursHint(h) {
    if (!h) return '';
    if (h.status === 'over') return `se ha pasado ${formatDuration(h.excess)}`;
    if (h.status === 'exhausted') return 'sin horas';
    return `quedan ${formatDuration(h.available)}`;
  }

  function renderHoursWarnings(all) {
    const box = $('hours-warnings');
    box.replaceChildren();
    const sent = review.confirmed?.sentAt ? review.confirmed.items : [];
    const warnings = [];
    for (const client of catalog.clients) {
      const h = client.hours;
      if (!h) continue;
      const today = all.filter((s) => s.bucket === 'client' && s.clientId === client.id).reduce((t, s) => t + s.seconds, 0);
      const before = sent.filter((i) => i.bucket === 'client' && i.clientId === client.id).reduce((t, i) => t + i.seconds, 0);
      const extra = today - before;
      if (extra <= 0) continue;
      if (extra > h.available) {
        const over = extra - h.available + h.excess;
        warnings.push(h.available > 0
          ? `${client.name}: le quedan ${formatDuration(h.available)} y hoy le asignas ${formatDuration(extra)}. Se pasará ${formatDuration(over)}.`
          : `${client.name} no tiene horas disponibles: con lo de hoy se pasará ${formatDuration(over)}.`);
      }
    }
    box.hidden = warnings.length === 0;
    if (warnings.length === 0) return;
    const title = document.createElement('strong');
    title.textContent = 'Horas contratadas';
    const list = document.createElement('ul');
    for (const w of warnings) {
      const li = document.createElement('li');
      li.textContent = w;
      list.append(li);
    }
    box.append(title, list);
  }

  function renderStatus() {
    const status = $('status');
    const detail = $('status-detail');
    const c = review.confirmed;
    const time = (iso) => new Date(iso).toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    if (!c) {
      status.className = 'badge muted';
      status.textContent = 'Sin confirmar';
      detail.textContent = review.today ? 'El día aún no ha terminado: puedes confirmarlo ahora y volver a hacerlo más tarde.' : '';
    } else if (c.sentAt) {
      status.className = 'badge ok';
      status.textContent = '✓ Enviado';
      detail.textContent = `Enviado el ${time(c.sentAt)}.`;
    } else {
      status.className = 'badge warning';
      status.textContent = 'Pendiente de envío';
      detail.textContent = `Confirmado el ${time(c.confirmedAt)}. ${c.lastError ?? 'Se enviará en cuanto haya conexión.'}`;
    }

    const pending = $('pending');
    pending.replaceChildren();
    const unsent = review.pending.unsent.filter((d) => d.date !== selected);
    const unconfirmed = review.pending.unconfirmed.filter((d) => d !== selected);
    if (unconfirmed.length + unsent.length === 0) return;
    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = 'Pendientes:';
    pending.append(label);
    for (const date of unconfirmed) pending.append(chip(date, shortDate(date), 'Sin confirmar'));
    for (const d of unsent) pending.append(chip(d.date, `${shortDate(d.date)} ⚠`, d.error ?? 'Pendiente de envío', 'unsent'));
  }

  function chip(date, text, title, extra = '') {
    const b = document.createElement('button');
    b.className = `chip ${extra}`;
    b.textContent = text;
    b.title = title;
    b.addEventListener('click', () => selectDay(date));
    return b;
  }

  // --- Selector de cliente -------------------------------------------------

  const picker = $('picker');
  const search = $('picker-search');
  let pickerRow = null;
  let options = [];
  let active = 0;

  function openPicker(row, anchor) {
    pickerRow = row;
    const r = anchor.getBoundingClientRect();
    picker.style.left = `${Math.min(r.left + scrollX, scrollX + innerWidth - 336)}px`;
    picker.style.top = `${r.bottom + scrollY + 4}px`;
    picker.hidden = false;
    search.value = '';
    $('picker-msg').textContent = '';
    active = 0;
    renderOptions();
    search.focus();
  }

  function closePicker() {
    picker.hidden = true;
    pickerRow = null;
  }

  function renderOptions() {
    const q = search.value.trim();
    const ql = q.toLowerCase();
    const fixed = pickerRow?.kind === 'manual' ? FIXED.filter((f) => MANUAL_BUCKETS.includes(f.bucket)) : FIXED;
    options = [
      ...fixed.filter((f) => !ql || f.label.toLowerCase().includes(ql)).map((f) => ({ ...f, clientId: null })),
      { separator: true },
      ...catalog.clients
        .filter((c) => !ql || c.name.toLowerCase().includes(ql))
        .map((c) => ({ bucket: 'client', clientId: c.id, label: c.name, hint: hoursHint(c.hours) })),
    ];
    if (q && !catalog.clients.some((c) => c.name.toLowerCase() === ql)) {
      options.push({ create: q, label: `+ Crear cliente «${q}»` });
    }
    // Al escribir, se activa la primera coincidencia (fijas incluidas), y "Crear" solo si no hay otra.
    active = 0;

    const list = $('picker-list');
    list.replaceChildren();
    let i = 0;
    for (const o of options) {
      const li = document.createElement('li');
      if (o.separator) {
        li.className = 'separator';
        list.append(li);
        continue;
      }
      const index = i++;
      li.setAttribute('role', 'option');
      if (index === active) li.classList.add('active');
      if (o.create) li.classList.add('create');
      li.append(o.label);
      if (o.hint) {
        const hint = document.createElement('span');
        hint.className = 'hint';
        hint.textContent = o.hint;
        li.append(hint);
      }
      li.addEventListener('mousedown', (e) => { e.preventDefault(); choose(o); });
      list.append(li);
    }
    if (catalog.clients.length === 0 && !q) {
      const li = document.createElement('li');
      li.className = 'hint';
      li.textContent = 'Escribe un nombre para crear el primer cliente.';
      list.append(li);
    }
  }

  async function choose(option) {
    const row = pickerRow;
    if (!row) return;
    if (option.create) {
      try {
        const client = await api('POST', '/api/clients', { name: option.create });
        if (!catalog.clients.some((c) => c.id === client.id)) {
          catalog.clients.push(client);
          catalog.clients.sort((a, b) => a.name.localeCompare(b.name, 'es'));
        }
        option = { bucket: 'client', clientId: client.id };
      } catch (err) {
        $('picker-msg').textContent = err.message;
        return;
      }
    }
    row.bucket = option.bucket;
    row.clientId = option.clientId;
    // Si mientras se creaba el cliente se abrió el selector de otra fila, no lo cerramos.
    if (pickerRow === row) closePicker();
    render();
  }

  search.addEventListener('input', renderOptions);
  search.addEventListener('keydown', (e) => {
    const selectable = options.filter((o) => !o.separator);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      active = (active + (e.key === 'ArrowDown' ? 1 : -1) + selectable.length) % selectable.length;
      const q = search.value;
      renderOptionsKeepingActive(q);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (selectable[active]) choose(selectable[active]);
    } else if (e.key === 'Escape') {
      closePicker();
    }
  });
  /** Repinta la lista sin recalcular la opción activa (al moverse con las flechas). */
  function renderOptionsKeepingActive() {
    const keep = active;
    const list = $('picker-list');
    [...list.querySelectorAll('li[role="option"]')].forEach((li, i) => li.classList.toggle('active', i === keep));
    list.querySelector('li.active')?.scrollIntoView({ block: 'nearest' });
  }
  document.addEventListener('mousedown', (e) => {
    if (!picker.hidden && !picker.contains(e.target)) closePicker();
  });

  // --- Carga y confirmación ------------------------------------------------

  async function loadCatalog() {
    catalog = await api('GET', '/api/catalog');
    const warning = $('warning');
    warning.replaceChildren();
    if (catalog.notConfigured) {
      const link = document.createElement('a');
      link.href = '/ajustes';
      link.textContent = 'Ajustes';
      warning.append('Conecta el agente con la web en ', link, ' para elegir clientes y enviar el día.');
    } else if (catalog.warning) {
      warning.append(`${catalog.warning} Se usan los clientes guardados la última vez; el día se enviará cuando vuelva la conexión.`);
    }
    warning.hidden = warning.childNodes.length === 0;
  }

  // --- Comentarios ----------------------------------------------------------

  /** Texto de cada comentario: clave "general" o el id del cliente. Se conserva al cambiar asignaciones. */
  let notes = new Map();
  const MAX_NOTE_LENGTH = 2000;

  /** Un campo para el día y otro por cada cliente que tiene tiempo asignado ahora mismo. */
  function renderComments() {
    $('comments').hidden = rows.length === 0;
    const fields = $('comment-fields');
    fields.replaceChildren();
    const clientIds = [...new Set(rows.flatMap(shares).filter((s) => s.bucket === 'client' && s.seconds > 0).map((s) => s.clientId))];
    clientIds.sort((a, b) => clientName(a).localeCompare(clientName(b), 'es'));
    fields.append(commentField('general', 'Del día', 'Resumen general del día'));
    for (const id of clientIds) fields.append(commentField(id, clientName(id), `Qué hiciste para ${clientName(id)}`));
  }

  function commentField(key, label, placeholder) {
    const wrap = document.createElement('div');
    wrap.className = 'comment';
    const id = `note-${key}`;
    const labelEl = document.createElement('label');
    labelEl.htmlFor = id;
    labelEl.textContent = label;
    labelEl.title = label;
    if (key === 'general') labelEl.className = 'general';
    const textarea = document.createElement('textarea');
    textarea.id = id;
    textarea.rows = 1;
    textarea.maxLength = MAX_NOTE_LENGTH;
    textarea.placeholder = placeholder;
    textarea.value = notes.get(key) ?? '';
    textarea.addEventListener('input', () => notes.set(key, textarea.value));
    wrap.append(labelEl, textarea);
    return wrap;
  }

  /** Lo que se envía: el comentario del día y los de los clientes que siguen con tiempo asignado. */
  function notesToSend() {
    const clientIds = new Set(rows.flatMap(shares).filter((s) => s.bucket === 'client' && s.seconds > 0).map((s) => s.clientId));
    return [...notes]
      .filter(([key, text]) => text.trim() && (key === 'general' || clientIds.has(key)))
      .map(([key, text]) => ({ clientId: key === 'general' ? null : key, text: text.trim() }));
  }

  async function selectDay(iso) {
    selected = iso;
    history.replaceState(null, '', `/revisar?date=${iso}`);
    $('day').textContent = longDate(iso);
    $('next').disabled = iso >= todayISO();
    $('today').disabled = iso === todayISO();
    $('msg').textContent = '';
    try {
      const data = await api('GET', `/api/review?date=${iso}`);
      if (iso !== selected) return;
      review = data;
      notes = new Map((data.confirmed?.notes ?? []).map((n) => [n.clientId ?? 'general', n.text]));
      buildRows();
      render();
    } catch (err) {
      $('msg').className = 'msg error';
      $('msg').textContent = err.message;
    }
  }

  $('confirm').addEventListener('click', async () => {
    const manual = rows.filter((r) => r.kind === 'manual');
    if (manual.some((r) => !r.key.trim())) {
      say('Escribe qué hiciste en cada tiempo manual (o quítalo).');
      return;
    }
    if (manual.some((r) => r.seconds < 60)) {
      say('Cada tiempo manual debe ser de al menos un minuto.');
      return;
    }
    // Una actividad dividida se envía como varias partidas, una por parte (sin recordar regla).
    const items = rows.flatMap((r) => {
      if (r.kind === 'manual') {
        return [{ kind: 'manual', key: r.key.trim(), seconds: r.seconds, bucket: r.bucket, clientId: r.clientId, remember: false }];
      }
      if (r.members) return r.members.map((m) => ({ ...m, bucket: r.bucket, clientId: r.clientId, remember: false }));
      if (r.parts) {
        return shares(r)
          .filter((s) => s.seconds > 0)
          .map((s) => ({ kind: r.kind, key: r.key, seconds: s.seconds, bucket: s.bucket, clientId: s.clientId, remember: false }));
      }
      return [{ kind: r.kind, key: r.key, seconds: r.seconds, bucket: r.bucket, clientId: r.clientId, remember: r.bucket === 'client' && r.remember }];
    });
    const button = $('confirm');
    button.disabled = true;
    $('msg').className = 'msg';
    $('msg').textContent = 'Enviando…';
    try {
      const date = selected;
      const { confirmed } = await api('POST', `/api/review/${date}`, { items, notes: notesToSend() });
      $('msg').className = confirmed.sentAt ? 'msg ok' : 'msg error';
      $('msg').textContent = confirmed.sentAt ? 'Día confirmado y enviado.' : 'Guardado, pero aún no se ha podido enviar.';
      const fresh = await api('GET', `/api/review?date=${date}`);
      if (date === selected) {
        review = fresh;
        renderStatus();
        $('confirm').textContent = 'Volver a confirmar y enviar';
      }
    } catch (err) {
      $('msg').className = 'msg error';
      $('msg').textContent = err.message;
    } finally {
      button.disabled = false;
    }
  });

  $('add-manual').addEventListener('click', addManual);
  $('prev').addEventListener('click', () => selectDay(shiftDay(selected, -1)));
  $('next').addEventListener('click', () => selectDay(shiftDay(selected, 1)));
  $('today').addEventListener('click', () => selectDay(todayISO()));

  await loadCatalog().catch((err) => {
    $('warning').textContent = err.message;
    $('warning').hidden = false;
  });
  selectDay(selected);
</script>
</body>
</html>
