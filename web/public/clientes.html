<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clientes · DIALOGUE</title>
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  .layout { display: grid; grid-template-columns: minmax(260px, 1fr) 2fr; gap: 16px; align-items: start; }
  .clients { list-style: none; margin: 12px 0 0; padding: 0; max-height: 70vh; overflow: auto; }
  .clients button {
    width: 100%; display: flex; justify-content: space-between; gap: 12px; align-items: baseline;
    text-align: left; border: 0; border-radius: 6px; padding: 9px 8px;
  }
  .clients li + li button { border-top: 1px solid var(--border); border-radius: 0; }
  .clients button[aria-current="true"] { background: var(--hover); box-shadow: inset 3px 0 0 var(--pulse); }
  .clients .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clients .time { color: var(--text-secondary); white-space: nowrap; font-size: 13px; }

  .detail-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .hours { margin: 0 0 20px; padding: 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-0); }
  .hours-title { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .hours-title h4 { margin: 0; font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .08em; }
  .hours .check { display: flex; align-items: center; gap: 8px; color: var(--text-primary); font-size: 14px; }
  .hours .check input { width: auto; margin: 0; }
  .hours .small { margin: 4px 0 0; font-size: 13px; }
  .hours-grid { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; margin: 12px 0; }
  .hours-grid label { margin: 0; flex: 1 1 130px; }
  .hours-grid button { flex: none; }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0 0 8px; }
  .facts dt { color: var(--text-secondary); }
  .facts dd { margin: 0; }
  .packs { list-style: none; margin: 0 0 4px; padding: 0; }
  .packs li { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--border); }
  .packs .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .packs .value { color: var(--text-secondary); white-space: nowrap; }
  .packs .spent { color: var(--text-muted); text-decoration: line-through; }
  button.link { border: 0; padding: 2px 4px; color: var(--accent); }
  button.link.danger { color: var(--danger); }
  .clients .name .badge { margin-left: 4px; }
  .detail h3 { margin: 0; font-size: 20px; }
  .delete-box {
    margin: 0 0 18px; padding: 14px; border-radius: 8px;
    border: 1px solid var(--danger); background: var(--surface-0);
  }
  .delete-box p { margin: 0 0 10px; color: var(--text-primary); }
  .delete-box select {
    display: block; width: 100%; margin-bottom: 12px; padding: 7px 10px; font: inherit;
    color: var(--text-primary); background: var(--surface-1); border: 1px solid var(--border); border-radius: 6px;
  }
  button.danger-solid { background: var(--danger); border-color: var(--danger); color: var(--accent-text); }
  button.danger-solid:hover:not(:disabled) { background: var(--danger); filter: brightness(1.1); }
  .detail .since { margin: 2px 0 16px; color: var(--text-muted); font-size: 13px; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  .kpi { background: var(--surface-0); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .kpi .label { color: var(--text-secondary); font-size: 12px; }
  .kpi .value { font: 600 22px/1.2 var(--font-title); }
  .sections { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 24px; }
  .sections h4 {
    margin: 0 0 8px; font-size: 12px; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: .08em;
  }
  .lines { list-style: none; margin: 0; padding: 0; }
  .lines li { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .lines .label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lines .value { color: var(--text-secondary); white-space: nowrap; }
  .months li { display: grid; grid-template-columns: 120px 1fr 90px; gap: 10px; }
  .months a { color: var(--text-primary); text-decoration: none; }
  .months a:hover { color: var(--accent); text-decoration: underline; }
  .months .value { text-align: right; }
  .track { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
  .bar { height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 2px; }
  .notes { grid-column: 1 / -1; }
  .notes li { display: block; padding: 8px 0; border-top: 1px solid var(--border); }
  .notes li:first-child { border-top: 0; }
  .notes .meta { color: var(--text-muted); font-size: 12px; }
  .notes .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .placeholder { color: var(--text-muted); text-align: center; padding: 48px 16px; }

  @media (max-width: 860px) {
    .layout, .sections { grid-template-columns: 1fr; }
    .kpis { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<main class="layout">
  <section class="card">
    <h2>Clientes</h2>
    <form class="row" id="form">
      <input name="client" placeholder="Buscar o crear cliente…" autocomplete="off" maxlength="120">
      <button class="primary" type="submit">Nuevo</button>
    </form>
    <div class="msg" id="msg"></div>
    <ul class="clients" id="clients"></ul>
  </section>

  <section class="card detail" id="detail">
    <p class="placeholder">Elige un cliente para ver el tiempo que se le ha dedicado.</p>
  </section>
</main>
<script type="module">
  import {
    KIND_LABELS, activityLabel, api, capitalize, el, fmtDate, formatDuration, hoursLabel, monthLabel, say,
    showHoursAlerts, startPage, todayISO,
  } from '/app.js';

  const $ = (id) => document.getElementById(id);
  const form = $('form');
  let clients = [];
  let totals = new Map();
  let selected = Number(new URLSearchParams(location.search).get('id')) || null;

  function renderList() {
    const query = form.client.value.trim().toLowerCase();
    const shown = clients.filter((c) => c.name.toLowerCase().includes(query));
    const list = $('clients');
    list.replaceChildren();
    if (shown.length === 0) {
      list.append(el('li', 'muted', clients.length === 0
        ? 'Todavía no hay clientes.'
        : 'Ningún cliente coincide. Pulsa «Nuevo» para crearlo.'));
    }
    for (const c of shown) {
      const li = el('li');
      const button = el('button');
      button.setAttribute('aria-current', String(c.id === selected));
      const t = totals.get(c.id);
      const name = el('span', 'name', c.name);
      // Solo se marca a quien tiene seguimiento de horas y las ha agotado o se ha pasado.
      if (c.hours && c.hours.status !== 'ok') {
        const badge = el('span', `badge ${c.hours.status}`, c.hours.status === 'over' ? `+${formatDuration(c.hours.excess)}` : 'Agotado');
        badge.title = hoursLabel(c.hours);
        name.append(' ', badge);
      }
      button.append(name, el('span', 'time num', t ? formatDuration(t.seconds) : 'sin tiempo'));
      button.addEventListener('click', () => select(c.id));
      li.append(button);
      list.append(li);
    }
  }

  async function select(id) {
    selected = id;
    history.replaceState(null, '', `/clientes?id=${id}`);
    renderList();
    const detail = $('detail');
    try {
      const data = await api('GET', `/api/reports/clients/${id}`);
      if (id !== selected) return;
      renderDetail(data);
    } catch (err) {
      detail.replaceChildren(el('p', 'msg error', err.message));
    }
  }

  function renderDetail(d) {
    const detail = $('detail');
    detail.replaceChildren();
    const head = el('div', 'detail-head');
    const titles = el('div');
    titles.append(
      el('h3', '', d.name),
      el('p', 'since', `Cliente desde el ${new Date(d.createdAt).toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' })}`),
    );
    const remove = el('button', 'danger', 'Borrar cliente');
    remove.addEventListener('click', () => showDelete(d, detail));
    head.append(titles, remove);
    detail.append(head);

    const thisMonth = d.byMonth.find((m) => m.month === todayISO().slice(0, 7))?.seconds ?? 0;
    const kpis = el('div', 'kpis');
    for (const [label, value] of [
      ['Total', formatDuration(d.totalSeconds)],
      ['Este mes', formatDuration(thisMonth)],
      ['Personas', String(d.byUser.length)],
    ]) {
      const kpi = el('div', 'kpi');
      kpi.append(el('div', 'label', label), el('div', 'value num', value));
      kpis.append(kpi);
    }
    detail.append(kpis, hoursSection(d));

    if (d.totalSeconds === 0) {
      detail.append(el('p', 'muted', 'Todavía nadie ha confirmado tiempo para este cliente.'));
      return;
    }

    const sections = el('div', 'sections');

    // Por mes: cada mes lleva a su detalle en Tiempos.
    const months = section('Por mes');
    const monthList = el('ul', 'lines months');
    const max = Math.max(...d.byMonth.map((m) => m.seconds));
    for (const m of d.byMonth) {
      const li = el('li');
      const link = el('a', 'label', monthLabel(m.month));
      link.href = `/?vista=cliente&mes=${m.month}`;
      link.title = 'Ver el detalle del mes en Tiempos';
      const track = el('div', 'track');
      const bar = el('div', 'bar');
      bar.style.width = `${(m.seconds / max) * 100}%`;
      track.append(bar);
      li.append(link, track, el('span', 'value num', formatDuration(m.seconds)));
      monthList.append(li);
    }
    months.append(monthList);

    const people = section('Por persona');
    people.append(lines(d.byUser.map((u) => [u.name, u.seconds,
      `Última vez: ${capitalize(fmtDate(u.lastDate, { weekday: 'short', day: 'numeric', month: 'short' }))}`])));

    const activities = section('Webs, chats y apps');
    const ul = el('ul', 'lines');
    for (const a of d.activities) {
      const li = el('li');
      const label = el('span', 'label', activityLabel(a));
      label.title = activityLabel(a);
      li.append(el('span', 'kind', KIND_LABELS[a.kind] ?? a.kind), label, el('span', 'value num', formatDuration(a.seconds)));
      ul.append(li);
    }
    activities.append(ul);

    const notes = section('Comentarios');
    notes.classList.add('notes');
    if (d.notes.length === 0) {
      notes.append(el('p', 'muted', 'Sin comentarios. Se escriben al confirmar el día en el agente.'));
    } else {
      const list = el('ul', 'lines');
      for (const n of d.notes) {
        const li = el('li');
        li.append(
          el('div', 'meta', `${capitalize(fmtDate(n.date, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }))} · ${n.userName}`),
          el('div', 'text', n.note),
        );
        list.append(li);
      }
      notes.append(list);
    }

    sections.append(months, people, activities, notes);
    detail.append(sections);
  }

  /**
   * Paso de confirmación para borrar. Si el cliente tiene tiempo, hay que elegir adónde
   * pasa (Sin cliente u otro cliente, para unir duplicados): nunca se pierden horas.
   */
  function showDelete(d, detail) {
    detail.querySelector('.delete-box')?.remove();
    const box = el('div', 'delete-box');
    box.setAttribute('role', 'region');
    box.setAttribute('aria-label', `Borrar ${d.name}`);
    let target = null;
    if (d.totalSeconds > 0) {
      box.append(el('p', '', `«${d.name}» tiene ${formatDuration(d.totalSeconds)} de tiempo confirmado, con sus comentarios. ¿Adónde lo pasamos?`));
      target = el('select');
      target.setAttribute('aria-label', 'Adónde pasa el tiempo');
      target.append(new Option('A «Sin cliente»', ''));
      for (const c of clients.filter((c) => c.id !== d.id)) target.append(new Option(`A «${c.name}» (unir los dos)`, String(c.id)));
      box.append(target);
    } else {
      box.append(el('p', '', `«${d.name}» no tiene tiempo confirmado.`));
    }
    const actions = el('div', 'row');
    const confirm = el('button', 'danger-solid', `Borrar «${d.name}»`);
    const cancel = el('button', '', 'Cancelar');
    const msg = el('div', 'msg');
    actions.append(confirm, cancel);
    box.append(actions, msg);
    cancel.addEventListener('click', () => box.remove());
    confirm.addEventListener('click', async () => {
      confirm.disabled = true;
      const moveTo = target && target.value ? Number(target.value) : null;
      try {
        const r = await api('DELETE', `/api/clients/${d.id}`, { moveTo });
        clients = clients.filter((c) => c.id !== d.id);
        totals.delete(d.id);
        if (moveTo !== null) {
          const prev = totals.get(moveTo);
          totals.set(moveTo, { id: moveTo, seconds: (prev?.seconds ?? 0) + r.movedSeconds });
        }
        say('msg', r.movedSeconds
          ? `«${r.deleted}» borrado. Su tiempo (${formatDuration(r.movedSeconds)}) ha pasado a ${r.movedTo ? `«${r.movedTo}»` : '«Sin cliente»'}.`
          : `«${r.deleted}» borrado.`, 'ok');
        if (moveTo !== null) {
          select(moveTo);
        } else {
          selected = null;
          history.replaceState(null, '', '/clientes');
          renderList();
          $('detail').replaceChildren(el('p', 'placeholder', 'Elige un cliente para ver el tiempo que se le ha dedicado.'));
        }
      } catch (err) {
        confirm.disabled = false;
        msg.className = 'msg error';
        msg.textContent = err.message;
      }
    });
    detail.querySelector('.detail-head').after(box);
    (target ?? confirm).focus();
  }

  // --- Horas contratadas ----------------------------------------------------

  const longDate = (iso) => new Date(`${iso}T00:00:00`).toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' });
  const hoursValue = (seconds) => String(Math.round((seconds / 3600) * 100) / 100);

  /** Seguimiento de horas: cuota mensual, bonos y lo que queda. Se vuelve a pintar tras cada cambio. */
  function hoursSection(d) {
    const box = el('div', 'hours');
    box.id = 'hours';
    fillHours(box, d.id, d.hours);
    return box;
  }

  function fillHours(box, clientId, h) {
    box.replaceChildren();
    const title = el('div', 'hours-title');
    title.append(el('h4', '', 'Horas contratadas'));
    if (h?.status && h.status !== 'none') title.append(el('span', `badge ${h.status}`, hoursLabel(h)));
    box.append(title);

    const toggle = el('label', 'check');
    const box1 = el('input');
    box1.type = 'checkbox';
    box1.checked = Boolean(h?.tracking);
    toggle.append(box1, ' Hacer seguimiento de horas');
    box.append(toggle);
    box1.addEventListener('change', () => save({ trackHours: box1.checked }));

    if (!h?.tracking) {
      box.append(el('p', 'muted small', 'Actívalo para poner una cuota mensual o bonos y recibir un aviso si se agotan.'));
      return;
    }

    // Cuota mensual y desde cuándo se cuenta.
    const settings = el('form', 'hours-grid');
    const monthly = el('input');
    monthly.type = 'number';
    monthly.min = '0';
    monthly.step = '0.5';
    monthly.placeholder = 'Sin cuota';
    monthly.value = h.monthlySeconds ? hoursValue(h.monthlySeconds) : '';
    monthly.setAttribute('aria-label', 'Horas al mes');
    const since = el('input');
    since.type = 'date';
    since.value = h.trackingSince ?? '';
    since.setAttribute('aria-label', 'Contar desde');
    const saveBtn = el('button', '', 'Guardar');
    saveBtn.type = 'submit';
    const l1 = el('label', '', 'Horas al mes');
    l1.append(monthly);
    const l2 = el('label', '', 'Contar desde');
    l2.append(since);
    settings.append(l1, l2, saveBtn);
    settings.addEventListener('submit', (e) => {
      e.preventDefault();
      save({ monthlyHours: monthly.value ? Number(monthly.value) : null, trackingSince: since.value || undefined });
    });
    box.append(settings);

    // Situación de este mes y de los bonos.
    const facts = el('dl', 'facts');
    const fact = (term, value) => facts.append(el('dt', '', term), el('dd', 'num', value));
    if (h.monthlySeconds) {
      fact('Este mes', `${formatDuration(h.usedThisMonth)} de ${formatDuration(h.monthlySeconds)} · quedan ${formatDuration(h.monthlyRemaining)}`);
    } else {
      fact('Este mes', `${formatDuration(h.usedThisMonth)} (sin cuota mensual)`);
    }
    fact('En bonos', h.packs.length ? `quedan ${formatDuration(h.packsRemaining)}` : 'sin bonos');
    if (h.excess > 0) fact('Exceso', `${formatDuration(h.excess)} por encima de lo contratado`);
    box.append(facts);

    // Bonos.
    if (h.packs.length) {
      const list = el('ul', 'packs');
      for (const p of h.packs) {
        const li = el('li');
        const info = el('span', 'label', `Bono de ${formatDuration(p.seconds)} · ${longDate(p.purchasedOn)}${p.note ? ` · ${p.note}` : ''}`);
        const left = el('span', `value num${p.remainingSeconds === 0 ? ' spent' : ''}`, p.remainingSeconds ? `quedan ${formatDuration(p.remainingSeconds)}` : 'gastado');
        const remove = el('button', 'link danger', 'Quitar');
        remove.setAttribute('aria-label', `Quitar el bono de ${formatDuration(p.seconds)} del ${longDate(p.purchasedOn)}`);
        remove.addEventListener('click', async () => {
          if (!confirm(`¿Quitar el bono de ${formatDuration(p.seconds)} del ${longDate(p.purchasedOn)}?`)) return;
          try {
            refresh(clientId, await api('DELETE', `/api/clients/${clientId}/packs/${p.id}`));
          } catch (err) {
            say('msg', err.message);
          }
        });
        li.append(info, left, remove);
        list.append(li);
      }
      box.append(list);
    }

    const add = el('form', 'hours-grid');
    const hours = el('input');
    hours.type = 'number';
    hours.min = '0.5';
    hours.step = '0.5';
    hours.required = true;
    hours.placeholder = 'p. ej. 5';
    const date = el('input');
    date.type = 'date';
    date.value = todayISO();
    const note = el('input');
    note.maxLength = 200;
    note.placeholder = 'Opcional';
    const addBtn = el('button', 'primary', 'Añadir bono');
    addBtn.type = 'submit';
    const a1 = el('label', '', 'Horas del bono');
    a1.append(hours);
    const a2 = el('label', '', 'Comprado el');
    a2.append(date);
    const a3 = el('label', '', 'Nota');
    a3.append(note);
    add.append(a1, a2, a3, addBtn);
    add.addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        refresh(clientId, await api('POST', `/api/clients/${clientId}/packs`, {
          hours: Number(hours.value), purchasedOn: date.value || undefined, note: note.value,
        }));
        say('msg', `Bono de ${hours.value} h añadido.`, 'ok');
      } catch (err) {
        say('msg', err.message);
      }
    });
    box.append(add);

    async function save(changes) {
      try {
        refresh(clientId, await api('PATCH', `/api/clients/${clientId}`, changes));
      } catch (err) {
        say('msg', err.message);
      }
    }
  }

  /** Tras un cambio: vuelve a pintar las horas, la marca de la lista y el aviso de arriba. */
  async function refresh(clientId, budget) {
    const box = $('hours');
    if (box) fillHours(box, clientId, budget);
    clients = await api('GET', '/api/clients');
    renderList();
    showHoursAlerts();
  }

  function section(title) {
    const div = el('div');
    div.append(el('h4', '', title));
    return div;
  }

  function lines(rows) {
    const ul = el('ul', 'lines');
    for (const [label, seconds, title] of rows) {
      const li = el('li');
      if (title) li.title = title;
      li.append(el('span', 'label', label), el('span', 'value num', formatDuration(seconds)));
      ul.append(li);
    }
    return ul;
  }

  form.client.addEventListener('input', renderList);
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      const created = await api('POST', '/api/clients', { name: form.client.value });
      if (!clients.some((c) => c.id === created.id)) clients.push(created);
      clients.sort((a, b) => a.name.localeCompare(b.name, 'es'));
      form.client.value = '';
      say('msg', `Cliente «${created.name}» listo.`, 'ok');
      select(created.id);
    } catch (err) {
      say('msg', err.message);
    }
  });

  await startPage('/clientes');
  const [list, sums] = await Promise.all([api('GET', '/api/clients'), api('GET', '/api/reports/clients')]);
  clients = list;
  totals = new Map(sums.map((t) => [t.id, t]));
  renderList();
  showHoursAlerts();
  if (selected && clients.some((c) => c.id === selected)) select(selected);
</script>
</body>
</html>
