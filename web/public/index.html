<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiempos · DIALOGUE</title>
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }

  table { width: 100%; border-collapse: collapse; }
  th { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-align: left; padding: 8px; border-bottom: 1px solid var(--border); }
  td { padding: 4px 8px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: 0; }
  th.day, td.day, th.total, td.total { text-align: right; white-space: nowrap; }
  th.today { color: var(--accent); }
  td.total { font-weight: 600; }
  .cell {
    width: 100%; text-align: right; border: 0; padding: 6px 8px; border-radius: 6px;
    font-variant-numeric: tabular-nums;
  }
  .cell.none { color: var(--text-muted); }
  .cell[aria-pressed="true"] { background: var(--hover); outline: 1px solid var(--accent); }

  .clients-list { display: flex; flex-direction: column; }
  .client-row {
    /* Columnas fijas: así todas las barras empiezan en el mismo sitio y se comparan bien. */
    display: grid; grid-template-columns: 200px 1fr 110px; gap: 4px 16px; align-items: center;
    width: 100%; text-align: left; border: 0; border-radius: 6px; padding: 10px 8px;
  }
  .client-row + .client-row { border-top: 1px solid var(--border); border-radius: 0; }
  .client-row[aria-pressed="true"] { background: var(--hover); }
  .client-row .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .client-row.bucket .name { font-weight: 400; color: var(--text-secondary); }
  .client-row .people { grid-column: 1 / -1; color: var(--text-muted); font-size: 13px; }
  .client-row > .num { text-align: right; }
  .track { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
  .bar { height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 2px; }
  .client-row.bucket .bar { opacity: .45; }

  .detail-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .detail-head h3 { margin: 0; font-size: 16px; }
  .detail-cols { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 24px; }
  .detail-cols h4 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .06em; }
  .lines { list-style: none; margin: 0; padding: 0; }
  .lines li { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .lines .label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lines .value { color: var(--text-secondary); white-space: nowrap; }
  .group { margin-bottom: 14px; }
  .group-title { display: flex; justify-content: space-between; font-weight: 600; padding: 4px 0; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
  .group-title.bucket { font-weight: 400; color: var(--text-secondary); }
  .note {
    margin: 6px 0 8px; padding: 8px 12px; border-left: 3px solid var(--pulse);
    background: var(--surface-0); border-radius: 0 6px 6px 0;
    white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text-secondary);
  }
  .note.general { margin: 0 0 14px; }
  .notes-list { margin-top: 20px; }
  .notes-list h4 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .06em; }
  .notes-list .meta { color: var(--text-muted); font-size: 12px; margin-top: 10px; }
  .group .lines { padding-left: 4px; }
  .cell.manual-only { font-style: italic; }
  .usage { display: flex; gap: 4px 20px; flex-wrap: wrap; margin-bottom: 12px; color: var(--text-secondary); }
  .usage strong { color: var(--text-primary); font-weight: 600; margin-left: 4px; }
  .unassigned-total { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; color: var(--text-secondary); border-top: 1px solid var(--border); }
  .unassigned-total small { display: block; color: var(--text-muted); font-size: 12px; }
  .lines button.link { font-size: 12px; color: var(--danger); }

  .toolbar .spacer { flex: 1; }
  #manual h2 { margin-top: 0; }
  .manual-form { display: grid; grid-template-columns: 150px 110px 220px 1fr auto; gap: 10px; align-items: end; }
  .manual-form label { margin: 0; }
  .manual-form select {
    display: block; width: 100%; margin-top: 4px; padding: 7px 10px; font: inherit; color: var(--text-primary);
    background: var(--surface-0); border: 1px solid var(--border); border-radius: 6px;
  }

  @media (max-width: 800px) {
    .manual-form { grid-template-columns: 1fr 1fr; }
    .detail-cols { grid-template-columns: 1fr; }
    .client-row { grid-template-columns: 120px 1fr 90px; }
    .table-scroll { overflow-x: auto; }
  }
</style>
</head>
<body>
<main>
  <div class="toolbar">
    <div class="tabs" role="group" aria-label="Vista">
      <button id="tab-person" aria-pressed="true">Por persona y día</button>
      <button id="tab-client" aria-pressed="false">Por cliente y mes</button>
    </div>
    <div class="period">
      <button id="prev" aria-label="Anterior">◀</button>
      <span id="period"></span>
      <button id="next" aria-label="Siguiente">▶</button>
      <button id="now">Actual</button>
    </div>
    <button class="primary" id="add-manual" aria-expanded="false" aria-controls="manual">+ Añadir tiempo</button>
  </div>

  <section class="card" id="manual" hidden>
    <h2>Añadir tiempo a mano</h2>
    <p>Para lo que no hiciste en el ordenador: reuniones, llamadas, visitas… Se suma a tus horas de ese día.</p>
    <form class="manual-form" id="manual-form">
      <label>Día <input type="date" name="date" required></label>
      <label>Tiempo <input name="time" required placeholder="1:30" inputmode="numeric" title="Escribe 1:30, 90 o 1h30" autocomplete="off"></label>
      <label>Para <select name="target" required></select></label>
      <label>Descripción <input name="description" required maxlength="255" placeholder="Reunión de seguimiento" autocomplete="off"></label>
      <button class="primary" type="submit">Añadir</button>
    </form>
    <div class="msg" id="manual-msg"></div>
  </section>

  <section class="card" id="person-view">
    <div class="table-scroll"><table id="week"></table></div>
    <p class="muted" id="week-empty" hidden>Todavía no hay usuarios.</p>
  </section>

  <section class="card" id="client-view" hidden>
    <div class="clients-list" id="month"></div>
    <p class="empty" id="month-empty" hidden>Nadie ha confirmado tiempo este mes.</p>
  </section>

  <section class="card" id="detail" hidden></section>
  <div class="msg error" id="msg"></div>
</main>

<script type="module">
  import {
    KIND_LABELS, UNASSIGNED_HINT, activityLabel, addDays, addMonths, api, capitalize, el, fmtDate, formatDuration,
    groupLabel, mondayOf, monthLabel, parseMinutes, say, showHoursAlerts, startPage, todayISO, usedPercent,
  } from '/app.js';

  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const state = {
    view: params.get('vista') === 'cliente' ? 'client' : 'person',
    week: mondayOf(params.get('semana') ?? todayISO()),
    month: params.get('mes') ?? todayISO().slice(0, 7),
  };

  function saveUrl() {
    const q = state.view === 'client' ? `vista=cliente&mes=${state.month}` : `semana=${state.week}`;
    history.replaceState(null, '', `/?${q}`);
  }

  function setView(view) {
    state.view = view;
    $('tab-person').setAttribute('aria-pressed', String(view === 'person'));
    $('tab-client').setAttribute('aria-pressed', String(view === 'client'));
    $('person-view').hidden = view !== 'person';
    $('client-view').hidden = view !== 'client';
    $('detail').hidden = true;
    load();
  }

  function shift(n) {
    if (state.view === 'person') state.week = addDays(state.week, 7 * n);
    else state.month = addMonths(state.month, n);
    $('detail').hidden = true;
    load();
  }

  async function load() {
    saveUrl();
    $('msg').textContent = '';
    try {
      if (state.view === 'person') await loadWeek();
      else await loadMonth();
    } catch (err) {
      $('msg').textContent = err.message;
    }
  }

  // --- Por persona y día ---------------------------------------------------

  async function loadWeek() {
    const end = addDays(state.week, 6);
    $('period').textContent = `Del ${fmtDate(state.week, { day: 'numeric', month: 'short' })} al ${fmtDate(end, { day: 'numeric', month: 'short', year: 'numeric' })}`;
    $('next').disabled = state.week >= mondayOf(todayISO());
    $('now').disabled = state.week === mondayOf(todayISO());
    const data = await api('GET', `/api/reports/week?start=${state.week}`);
    const table = $('week');
    table.replaceChildren();
    $('week-empty').hidden = data.users.length > 0;
    if (data.users.length === 0) return;

    const head = el('tr');
    head.append(el('th', '', 'Persona'));
    for (const d of data.days) {
      const th = el('th', `day${d === todayISO() ? ' today' : ''}`, capitalize(fmtDate(d, { weekday: 'short', day: 'numeric' })));
      head.append(th);
    }
    head.append(el('th', 'total', 'Total'));
    table.append(head);

    for (const user of data.users) {
      const tr = el('tr');
      tr.append(el('td', '', user.name));
      let total = 0;
      for (const d of data.days) {
        const td = el('td', 'day');
        const t = user.days[d];
        const seconds = t ? t.client + t.internal + t.unassigned : 0;
        total += seconds;
        const cell = el('button', !t ? 'cell none' : t.confirmed ? 'cell' : 'cell manual-only', t ? formatDuration(seconds) : '—');
        cell.title = t
          ? `Clientes ${formatDuration(t.client)} · Interno ${formatDuration(t.internal)} · Sin cliente ${formatDuration(t.unassigned)} · ${usedPercent(t.client + t.internal, seconds)} asignado` +
            (t.confirmed ? '' : '\nSolo tiempo manual: el día aún no se ha confirmado en la app.')
          : 'Sin confirmar';
        cell.setAttribute('aria-pressed', 'false');
        cell.disabled = !t;
        cell.addEventListener('click', () => {
          table.querySelectorAll('.cell[aria-pressed="true"]').forEach((c) => c.setAttribute('aria-pressed', 'false'));
          cell.setAttribute('aria-pressed', 'true');
          showDay(user.id, d);
        });
        td.append(cell);
        tr.append(td);
      }
      tr.append(el('td', 'total num', total ? formatDuration(total) : '—'));
      table.append(tr);
    }
  }

  async function showDay(userId, date) {
    const data = await api('GET', `/api/reports/day?userId=${userId}&date=${date}`);
    const detail = $('detail');
    detail.replaceChildren();
    const head = el('div', 'detail-head');
    head.append(el('h3', '', `${data.user.name} · ${fmtDate(date, { weekday: 'long', day: 'numeric', month: 'long' })}`));
    if (!data.confirmedAt) head.append(el('span', 'muted', 'Sin confirmar en la app: solo tiempo manual'));
    detail.append(head);

    // Tiempo de uso: todo lo enviado (lo personal nunca sale del PC). Asignado: clientes e interno.
    const used = data.groups.reduce((s, g) => s + g.seconds, 0);
    const total = used + data.unassignedSeconds;
    const usage = el('div', 'usage');
    for (const [label, value] of [['Tiempo de uso', formatDuration(total)], ['Asignado', formatDuration(used)], ['Utilizado', usedPercent(used, total)]]) {
      const item = el('div', '', label);
      item.append(el('strong', 'num', value));
      usage.append(item);
    }
    detail.append(usage);

    if (data.note) detail.append(el('div', 'note general', data.note));
    if (data.groups.length === 0 && !data.unassignedSeconds) detail.append(el('p', 'empty', 'Día confirmado sin tiempo.'));
    for (const g of data.groups) {
      const group = el('div', 'group');
      const title = el('div', g.bucket === 'client' ? 'group-title' : 'group-title bucket');
      title.append(el('span', '', groupLabel(g)), el('span', 'num', formatDuration(g.seconds)));
      group.append(title);
      if (g.note) group.append(el('div', 'note', g.note));
      group.append(activityList(g.items, userId === me.id ? () => showDay(userId, date) : null));
      detail.append(group);
    }
    if (data.unassignedSeconds) {
      const row = el('div', 'unassigned-total');
      const label = el('span', '', 'Sin cliente');
      label.append(el('small', '', UNASSIGNED_HINT));
      row.append(label, el('span', 'num', formatDuration(data.unassignedSeconds)));
      detail.append(row);
    }
    detail.hidden = false;
    detail.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // --- Por cliente y mes ---------------------------------------------------

  async function loadMonth() {
    $('period').textContent = monthLabel(state.month);
    $('next').disabled = state.month >= todayISO().slice(0, 7);
    $('now').disabled = state.month === todayISO().slice(0, 7);
    const data = await api('GET', `/api/reports/month?month=${state.month}`);
    const list = $('month');
    list.replaceChildren();
    $('month-empty').hidden = data.groups.length > 0;
    const max = Math.max(1, ...data.groups.map((g) => g.seconds));
    for (const g of data.groups) {
      const row = el('button', g.bucket === 'client' ? 'client-row' : 'client-row bucket');
      row.setAttribute('aria-pressed', 'false');
      const track = el('div', 'track');
      const bar = el('div', 'bar');
      bar.style.width = `${(g.seconds / max) * 100}%`;
      track.append(bar);
      row.append(
        el('span', 'name', groupLabel(g)),
        track,
        el('span', 'num', formatDuration(g.seconds)),
        el('span', 'people', g.byUser.map((u) => `${u.name} ${formatDuration(u.seconds)}`).join(' · ')),
      );
      row.addEventListener('click', () => {
        list.querySelectorAll('[aria-pressed="true"]').forEach((r) => r.setAttribute('aria-pressed', 'false'));
        row.setAttribute('aria-pressed', 'true');
        showClient(g);
      });
      list.append(row);
    }
  }

  async function showClient(group) {
    const q = group.bucket === 'client' ? `clientId=${group.clientId}` : `bucket=${group.bucket}`;
    const data = await api('GET', `/api/reports/month/detail?month=${state.month}&${q}`);
    const detail = $('detail');
    detail.replaceChildren();
    const head = el('div', 'detail-head');
    head.append(el('h3', '', `${data.name} · ${monthLabel(state.month)}`));
    head.append(el('span', 'muted num', `Total ${formatDuration(group.seconds)}`));

    const cols = el('div', 'detail-cols');
    const activities = el('div');
    activities.append(el('h4', '', 'Actividades'), group.bucket === 'unassigned' ? el('p', 'muted', UNASSIGNED_HINT) : activityList(data.activities));
    const people = el('div');
    people.append(el('h4', '', 'Por persona'), simpleList(data.byUser.map((u) => [u.name, u.seconds])));
    const days = el('div');
    days.append(el('h4', '', 'Por día'), simpleList(data.byDay.map((d) => [capitalize(fmtDate(d.date, { weekday: 'short', day: 'numeric' })), d.seconds])));
    cols.append(activities, people, days);
    detail.append(head, cols);
    if (data.notes?.length) {
      const notes = el('div', 'notes-list');
      notes.append(el('h4', '', 'Comentarios'));
      for (const n of data.notes) {
        notes.append(
          el('div', 'meta', `${capitalize(fmtDate(n.date, { weekday: 'short', day: 'numeric', month: 'short' }))} · ${n.userName}`),
          el('div', 'note', n.note),
        );
      }
      detail.append(notes);
    }
    detail.hidden = false;
    detail.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // --- Listas ---------------------------------------------------------------

  /** Con onDeleted, lo apuntado a mano en la web (lleva id) se puede borrar. */
  function activityList(items, onDeleted = null) {
    const ul = el('ul', 'lines');
    for (const a of items) {
      const li = el('li');
      li.append(el('span', 'kind', KIND_LABELS[a.kind] ?? a.kind), el('span', 'label', activityLabel(a)), el('span', 'value num', formatDuration(a.seconds)));
      li.querySelector('.label').title = activityLabel(a);
      if (onDeleted && a.id) {
        const remove = el('button', 'link', 'Borrar');
        remove.setAttribute('aria-label', `Borrar ${a.key}`);
        remove.addEventListener('click', async () => {
          if (!confirm(`¿Borrar «${a.key}» (${formatDuration(a.seconds)})?`)) return;
          try {
            await api('DELETE', `/api/days/manual/${a.id}`);
            await loadWeek();
            onDeleted();
          } catch (err) {
            $('msg').textContent = err.message;
          }
        });
        li.append(remove);
      }
      ul.append(li);
    }
    return ul;
  }

  // --- Tiempo manual --------------------------------------------------------

  async function openManual() {
    const panel = $('manual');
    const open = panel.hidden;
    panel.hidden = !open;
    $('add-manual').setAttribute('aria-expanded', String(open));
    if (!open) return;
    const form = $('manual-form');
    const field = (n) => form.elements.namedItem(n);
    field('date').max = todayISO();
    if (!field('date').value) field('date').value = todayISO();
    const target = field('target');
    const previous = target.value;
    const clients = await api('GET', '/api/clients');
    target.replaceChildren(new Option('Interno', 'internal'), ...clients.map((c) => new Option(c.name, `c${c.id}`)));
    if ([...target.options].some((o) => o.value === previous)) target.value = previous;
    field('time').focus();
  }

  $('manual-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const field = (n) => form.elements.namedItem(n).value;
    const minutes = parseMinutes(field('time'));
    if (!minutes) {
      say('manual-msg', 'Escribe el tiempo como 1:30, 90 o 1h30.');
      return;
    }
    const target = field('target');
    const date = field('date');
    try {
      await api('POST', `/api/days/${date}/manual`, {
        seconds: minutes * 60,
        bucket: target === 'internal' ? 'internal' : 'client',
        clientId: target === 'internal' ? null : Number(target.slice(1)),
        description: field('description'),
      });
      say('manual-msg', `Añadido: ${formatDuration(minutes * 60)} el ${fmtDate(date, { weekday: 'long', day: 'numeric', month: 'long' })}.`, 'ok');
      form.elements.namedItem('time').value = '';
      form.elements.namedItem('description').value = '';
      // Se muestra la semana de ese día con su detalle.
      if (state.view !== 'person') setView('person');
      state.week = mondayOf(date);
      await load();
      showDay(me.id, date);
    } catch (err) {
      say('manual-msg', err.message);
    }
  });

  function simpleList(pairs) {
    const ul = el('ul', 'lines');
    for (const [label, seconds] of pairs) {
      const li = el('li');
      li.append(el('span', 'label', label), el('span', 'value num', formatDuration(seconds)));
      ul.append(li);
    }
    return ul;
  }

  $('tab-person').addEventListener('click', () => setView('person'));
  $('tab-client').addEventListener('click', () => setView('client'));
  $('prev').addEventListener('click', () => shift(-1));
  $('next').addEventListener('click', () => shift(1));
  $('now').addEventListener('click', () => {
    state.week = mondayOf(todayISO());
    state.month = todayISO().slice(0, 7);
    $('detail').hidden = true;
    load();
  });

  $('add-manual').addEventListener('click', () => openManual().catch((err) => say('manual-msg', err.message)));

  const me = await startPage('/');
  setView(state.view);
  showHoursAlerts();
</script>
</body>
</html>
