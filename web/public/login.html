<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · DIALOGUE</title>
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  body { min-height: 100vh; display: grid; place-items: center; background: var(--deep-steel); }
  .login { width: min(380px, calc(100vw - 32px)); padding: 28px; }
  .login-brand { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 24px; text-align: center; }
  .login-brand img { width: 64px; height: 64px; }
  .login-brand h1 { margin: 0; font-size: 22px; letter-spacing: .08em; color: var(--text-primary); }
  .login-brand p { margin: 0; color: var(--text-secondary); font-size: 13px; }
  .login button.primary { width: 100%; margin-top: 6px; padding: 9px; }
</style>
</head>
<body>
<form class="card login" id="form">
  <div class="login-brand">
    <img src="/favicon.svg" alt="">
    <h1>DIALOGUE</h1>
    <p>Tiempo facturable para equipos, en vuestro propio servidor.</p>
  </div>
  <label>Email <input type="email" name="email" autocomplete="username" required></label>
  <label>Contraseña <input type="password" name="password" autocomplete="current-password" required></label>
  <button class="primary" type="submit">Entrar</button>
  <div class="msg" id="msg"></div>
</form>
<script type="module">
  import { api, say } from '/app.js';

  // Solo rutas propias: evita que un enlace manipulado nos mande a otra web tras entrar.
  const next = new URLSearchParams(location.search).get('next');
  const target = next && next.startsWith('/') && !next.startsWith('//') ? next : '/';

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target;
    try {
      await api('POST', '/api/auth/login', { email: f.email.value, password: f.password.value });
      location.href = target;
    } catch (err) {
      say('msg', err.message);
    }
  });
</script>
</body>
</html>
